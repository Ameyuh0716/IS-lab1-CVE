name: CI - Build, Test, SAST & SCA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-sast:
    name: Build, test and SAST (SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: secure-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit and integration tests
        run: mvn -B --no-transfer-progress test

      - name: SAST - SpotBugs
        run: mvn -B --no-transfer-progress -DskipTests spotbugs:check

      - name: Package
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: secure-api/target/spotbugsXml.xml
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: secure-api/target/surefire-reports/
          if-no-files-found: warn

  sca:
    name: SCA (OSV + OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: secure-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Fast, secret-free gate: resolves the Maven tree and asks OSV.dev for every
      # coordinate. Fails the build on any HIGH/CRITICAL advisory in ~1 minute.
      - name: SCA - OSV.dev
        run: python3 ../scripts/osv_scan.py .

      # Full scan with the NVD database. Enabled automatically once the repository
      # secret NVD_API_KEY exists (free: https://nvd.nist.gov/developers/request-an-api-key),
      # because without a key the first database download can take hours.
      - name: Cache NVD database
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: SCA - OWASP Dependency-Check
        if: ${{ env.NVD_API_KEY != '' }}
        run: mvn -B --no-transfer-progress -DskipTests org.owasp:dependency-check-maven:check

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            secure-api/target/osv-report.json
            secure-api/target/osv-report.md
            secure-api/target/dependency-check-report.html
            secure-api/target/dependency-check-report.json
          if-no-files-found: warn

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
